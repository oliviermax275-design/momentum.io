<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOMENTUM.IO — V0.1 Multijoueur</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#080f21;color:#ecf6ff;font-family:Inter,system-ui,Arial,sans-serif}canvas{display:block;width:100vw;height:100vh}#hud{pointer-events:none;position:fixed;inset:0}.panel{background:#0b1525df;border:1px solid #3e5a7588;border-radius:16px;padding:13px 16px;backdrop-filter:blur(12px)}#stats{position:absolute;top:18px;left:18px;min-width:218px}#brand{font-size:15px;font-weight:950;letter-spacing:1.3px;color:#7de9ff}#speed{font-size:33px;font-weight:950}#speed small{font-size:13px;font-weight:600;color:#94a8b9}#bar{height:8px;border-radius:99px;background:#263c4d;overflow:hidden;margin:7px 0}#fill{height:100%;width:100%;background:linear-gradient(90deg,#45c7ff,#b8fc76)}#sub{font-size:12px;color:#a0b7c7}#board{position:absolute;top:18px;right:18px;min-width:180px;font-size:13px}#board b{color:#bce7f4;display:block;margin-bottom:8px}#board .line{display:flex;justify-content:space-between;gap:16px;margin:5px 0}#board .me{color:#82f5eb;font-weight:900}#bottom{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);background:#0c1b2add;border:1px solid #44617877;border-radius:20px;padding:11px 16px;color:#bad5e8;font-size:13px;white-space:nowrap}kbd{background:#263f50;border:1px solid #598498;border-radius:5px;padding:2px 7px;color:white}#notice{position:absolute;top:23%;left:50%;transform:translateX(-50%);font-weight:900;font-size:24px;text-shadow:0 3px 22px #000;opacity:0;transition:.2s}#menuLayer{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#15354dbf,#040912ed 74%)}#menuLayer.hidden{display:none}#menu{max-width:570px;width:calc(100% - 30px);background:#101e31f4;border:1px solid #4e7897aa;border-radius:24px;padding:28px;text-align:center;box-shadow:0 25px 100px #0009}h1{margin:0;font-size:clamp(38px,7vw,65px);letter-spacing:-3px;line-height:1.1;background:linear-gradient(90deg,#86e9ff,#aefbba);background-clip:text;color:transparent}p{color:#b7d0e1;line-height:1.5}input{width:100%;border:1px solid #44657d;border-radius:10px;padding:12px 14px;background:#152b3f;color:#fff;font:inherit;margin:5px 0}button{border:0;border-radius:11px;padding:12px 16px;cursor:pointer;font:800 14px system-ui;color:#092333;background:linear-gradient(110deg,#7debff,#bafa8a)}button:hover{filter:brightness(1.12)}button.secondary{background:#253d52;color:#e0f1ff;border:1px solid #42637c}button:disabled{opacity:.4;cursor:not-allowed}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.divider{height:1px;background:#34536a;margin:18px 0}.servers{display:grid;gap:8px;margin:12px 0}.server{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#14293b;padding:10px 12px;border-radius:12px;border:1px solid #30516a;text-align:left}.server small{display:block;color:#a4bac9;margin-top:3px}.muted{font-size:12px;color:#89aabb}#share{color:#a4fbdf;overflow-wrap:anywhere;font-size:13px}#connection{position:fixed;left:50%;bottom:65px;transform:translateX(-50%);color:#e7c38f;font-size:12px;pointer-events:none}#leave{position:absolute;top:170px;left:18px;pointer-events:auto;padding:8px 11px;font-size:12px;background:#253d52;color:#e5f4ff;border:1px solid #4b6880}#leave.hidden{display:none}@media(max-width:640px){#stats{top:9px;left:9px;padding:9px;min-width:152px}#speed{font-size:23px}#board{right:9px;top:9px;min-width:110px;padding:10px;font-size:11px}#bottom{font-size:11px;bottom:6px;width:calc(100% - 20px);white-space:normal;text-align:center}#leave{top:136px;left:9px}#menu{padding:19px}}
</style></head><body><canvas id="game"></canvas><div id="hud"><div class="panel" id="stats"><div id="brand">◈ MOMENTUM.IO</div><div id="speed">0 <small>km/h</small></div><div id="bar"><div id="fill"></div></div><div id="sub">Énergie 100% · Niv. 1</div></div><div id="board" class="panel"><b>CLASSEMENT</b><div>—</div></div><button id="leave" class="hidden">← Quitter le salon</button><div id="notice"></div><div id="bottom">🖱️ <b>Souris</b> : tourner &nbsp; · &nbsp; <kbd>ESPACE</kbd> : boost &nbsp; · &nbsp; collision : <b>le plus rapide gagne</b></div></div><div id="connection"></div><div id="menuLayer"><div id="menu"></div></div><script>
(()=>{'use strict';const cvs=document.getElementById('game'),ctx=cvs.getContext('2d'),UI={menu:document.getElementById('menu'),layer:document.getElementById('menuLayer'),speed:document.getElementById('speed'),fill:document.getElementById('fill'),sub:document.getElementById('sub'),board:document.getElementById('board'),notice:document.getElementById('notice'),conn:document.getElementById('connection'),leave:document.getElementById('leave')};let W=innerWidth,H=innerHeight,dpr=1,ws=null,id=null,room=null,world=2700,players=[],orbs=[],mouse={x:W*.7,y:H*.5},boost=false,last=performance.now(),time=0,camera={x:0,y:0},hudTick=0,sendTick=0,noticeTTL=0,dead=false,serverList=[],name=localStorage.getItem('momentum_name')||'Pilote',hue=180,roomCode=new URLSearchParams(location.search).get('room')||'';const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),TAU=2*Math.PI;function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);cvs.width=Math.round(W*dpr);cvs.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();function safe(s){return String(s||'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}function show(t,seconds=2){UI.notice.textContent=t;UI.notice.style.opacity='1';noticeTTL=seconds}function conn(t){UI.conn.textContent=t}function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}function connect(){if(ws&&ws.readyState<=1)return;conn('Connexion au serveur…');ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');ws.onopen=()=>{conn('');send({type:'hello',name,hue});if(roomCode)send({type:'join',id:roomCode})};ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}handle(m)};ws.onclose=()=>{room=null;id=null;UI.leave.classList.add('hidden');conn('Serveur déconnecté. Relance le serveur et recharge cette page.');showMenu()};ws.onerror=()=>conn('Connexion impossible : assure-toi que le serveur Node.js fonctionne.')}
function showMenu(){UI.layer.classList.remove('hidden');const saved=name;UI.menu.innerHTML=`<h1>MOMENTUM.IO</h1><p><b>Ne deviens pas plus gros. Deviens plus rapide.</b><br>Le gameplay original V0.1, maintenant avec tes amis.</p><input id="nick" maxlength="18" placeholder="Ton pseudo" value="${safe(saved)}"><div class="servers" id="servers"></div><div class="divider"></div><div class="row"><button id="create">Créer un salon privé</button><button class="secondary" id="join">Rejoindre par code</button></div><p class="muted">Souris pour diriger · Espace pour accélérer · Pas de classes, pas de boutique.</p>`;UI.menu.querySelector('#nick').addEventListener('change',saveNick);UI.menu.querySelector('#create').onclick=()=>{saveNick();send({type:'create',title:'Salon de '+name})};UI.menu.querySelector('#join').onclick=()=>{saveNick();const c=prompt('Code du salon privé :');if(c)send({type:'join',id:c.trim()})};renderServers();send({type:'list'})}
function saveNick(){const input=UI.menu.querySelector('#nick');if(!input)return;name=input.value.trim().slice(0,18)||'Pilote';try{localStorage.setItem('momentum_name',name)}catch{}send({type:'hello',name,hue})}
function renderServers(){let el=UI.menu.querySelector('#servers');if(!el)return;el.innerHTML='<b>🌐 Serveurs publics</b>'+serverList.map(s=>`<div class="server"><span><b>${safe(s.title)}</b><small>${s.players}/${s.max} joueurs</small></span><button data-id="${safe(s.id)}">Rejoindre</button></div>`).join('');el.querySelectorAll('button[data-id]').forEach(b=>b.onclick=()=>{saveNick();send({type:'join',id:b.dataset.id})})}
function handle(m){if(m.type==='servers'){serverList=m.servers||[];renderServers()}else if(m.type==='joined'){id=m.id;room=m.room;world=m.world;players=m.players;orbs=m.orbs;dead=false;UI.layer.classList.add('hidden');UI.leave.classList.remove('hidden');roomCode=room.private?room.id:'';if(room.private)history.replaceState(null,'','?room='+encodeURIComponent(room.id));else history.replaceState(null,'',location.pathname);show('Bienvenue dans '+room.title,2);conn('')}else if(m.type==='state'){players=m.players||[];orbs=(m.orbs||[]).map(o=>({id:o[0],x:o[1],y:o[2],power:o[3]}));const me=players.find(p=>p.id===id);if(me&&me.dead&&!dead){dead=true;showDeath()}if(me&&!me.dead)dead=false}else if(m.type==='kill'){if(m.victim===id){show('ÉLIMINÉ PAR '+m.name.toUpperCase(),2)}else if(m.killer===id)show('⚡ ÉLIMINATION !',2);else show('⚡ '+m.name+' a éliminé un joueur',1)}else if(m.type==='error'){alert(m.message)}else if(m.type==='notice')show(m.message,1.5)}
function showDeath(){UI.layer.classList.remove('hidden');let me=players.find(p=>p.id===id);UI.menu.innerHTML=`<h1>FIN DE COURSE</h1><p>Score : <b>${me?.score||0}</b> · Éliminations : <b>${me?.kills||0}</b><br>Le plus rapide remporte le choc.</p><button id="again">Réapparaître →</button><p class="muted">Tu restes dans le même salon avec tes amis.</p>`;UI.menu.querySelector('#again').onclick=()=>{send({type:'respawn'});UI.layer.classList.add('hidden');setTimeout(()=>send({type:'respawn'}),1900)}}
function updateUI(me){UI.speed.innerHTML=Math.round(Math.hypot(me.vx,me.vy)*.46)+' <small>km/h</small>';UI.fill.style.width=me.energy+'%';UI.fill.style.background=me.boosting?'linear-gradient(90deg,#f8a957,#f9f88e)':'linear-gradient(90deg,#46c8fb,#a9f987)';UI.sub.textContent=`Énergie ${me.energy}% · Niv. ${me.level} · Score ${me.score}`;let sorted=[...players].sort((a,b)=>b.score-a.score).slice(0,7);UI.board.innerHTML='<b>🏆 '+safe(room.title.toUpperCase())+'</b>'+sorted.map((p,i)=>`<div class="line ${p.id===id?'me':''}"><span>${i+1}. ${safe(p.name)}</span><span>${p.score}</span></div>`).join('')+`<div style="border-top:1px solid #34536a;padding-top:7px;color:#94b0c5">${players.length} joueur(s) en ligne</div>`}
function draw(){ctx.clearRect(0,0,W,H);const me=players.find(p=>p.id===id),origin=me||{x:0,y:0};camera.x+=(origin.x-camera.x)*.13;camera.y+=(origin.y-camera.y)*.13;const minX=camera.x-W/2-100,maxX=camera.x+W/2+100,minY=camera.y-H/2-100,maxY=camera.y+H/2+100;ctx.save();ctx.translate(W/2-camera.x,H/2-camera.y);ctx.fillStyle='#080f21';ctx.fillRect(minX,minY,maxX-minX,maxY-minY);ctx.strokeStyle='#1f355237';ctx.lineWidth=1;ctx.beginPath();for(let x=Math.floor(minX/90)*90;x<maxX;x+=90){ctx.moveTo(x,minY);ctx.lineTo(x,maxY)}for(let y=Math.floor(minY/90)*90;y<maxY;y+=90){ctx.moveTo(minX,y);ctx.lineTo(maxX,y)}ctx.stroke();ctx.strokeStyle='#2f789a';ctx.lineWidth=7;ctx.strokeRect(-world,-world,world*2,world*2);ctx.strokeStyle='#31557825';ctx.lineWidth=1.5;for(let r=450;r<2500;r+=450){ctx.beginPath();ctx.arc(0,0,r,0,TAU);ctx.stroke()}for(const o of orbs){if(o.x<minX||o.x>maxX||o.y<minY||o.y>maxY)continue;const v=.65+.3*Math.sin(time*3+o.id);ctx.fillStyle=`rgba(119,247,215,${v})`;ctx.shadowColor='#53eacc';ctx.shadowBlur=o.power===3?22:11;ctx.beginPath();ctx.arc(o.x,o.y,o.power===3?6:3.5,0,TAU);ctx.fill()}ctx.shadowBlur=0;for(const p of players){if(p.dead||p.x<minX-50||p.x>maxX+50||p.y<minY-50||p.y>maxY+50)continue;const speed=Math.hypot(p.vx,p.vy),v=clamp(speed/490,0,1);ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.angle);ctx.shadowColor=`hsl(${p.hue},95%,64%)`;ctx.shadowBlur=14+v*24;ctx.fillStyle=`hsl(${p.hue},90%,${p.inv?78:59}%)`;ctx.beginPath();ctx.moveTo(22,0);ctx.lineTo(-12,-13);ctx.lineTo(-6,0);ctx.lineTo(-12,13);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#e5faff';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='white';ctx.beginPath();ctx.arc(4,0,3.5,0,TAU);ctx.fill();if(p.boosting){ctx.fillStyle='#ffdc77';ctx.beginPath();ctx.moveTo(-10,-7);ctx.lineTo(-23-Math.sin(time*22)*5,0);ctx.lineTo(-10,7);ctx.fill()}ctx.restore();if(p.inv){ctx.strokeStyle=`hsla(${p.hue},100%,78%,.45)`;ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,26+Math.sin(time*9)*3,0,TAU);ctx.stroke()}ctx.font='700 12px system-ui';ctx.textAlign='center';ctx.fillStyle=p.id===id?'#bfffee':'#d2d9eb';ctx.fillText(p.name,p.x,p.y-29);ctx.font='11px system-ui';ctx.fillStyle='#9eb7c9';ctx.fillText(Math.round(speed*.46)+' km/h',p.x,p.y-42)}ctx.restore();if(me){const v=clamp(Math.hypot(me.vx,me.vy)/500,0,1);if(v>.6){ctx.save();ctx.globalAlpha=(v-.6)*.16;ctx.strokeStyle='#9defff';for(let i=0;i<17;i++){const x=(i*179.7+time*220)%W,y=(i*123.33+time*100)%H;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-me.vx*.06,y-me.vy*.06);ctx.stroke()}ctx.restore()}}}
function frame(t){const dt=Math.min((t-last)/1000,.05);last=t;time+=dt;if(noticeTTL>0){noticeTTL-=dt;if(noticeTTL<=0)UI.notice.style.opacity=0}const me=players.find(p=>p.id===id);if(me&&!me.dead&&room){sendTick+=dt;let dx=mouse.x-W/2,dy=mouse.y-H/2;if(sendTick>.04){sendTick=0;send({type:'input',angle:Math.hypot(dx,dy)<15?me.angle:Math.atan2(dy,dx),boost})}hudTick+=dt;if(hudTick>.15){hudTick=0;updateUI(me)}}draw();requestAnimationFrame(frame)}
UI.leave.onclick=()=>{send({type:'leave'});room=null;id=null;players=[];orbs=[];roomCode='';history.replaceState(null,'',location.pathname);UI.leave.classList.add('hidden');showMenu()};addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});addEventListener('keydown',e=>{if(e.code==='Space'){boost=true;e.preventDefault()}});addEventListener('keyup',e=>{if(e.code==='Space')boost=false});addEventListener('blur',()=>boost=false);showMenu();connect();requestAnimationFrame(frame)})();
</script></body></html>
